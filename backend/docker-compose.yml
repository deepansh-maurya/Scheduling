services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: scheduling-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: scheduling
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: meetly-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.3
    container_name: meetly-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  transcript-worker:
    build: .
    command: npx ts-node src/workers/transcript.worker.ts
    depends_on:
      - redis
      - postgres
      - elasticsearch
    env_file:
      - .env

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
